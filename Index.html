<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBG Converter - Glassmorphism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md rounded-3xl p-8 text-white">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold mb-1">MBG Converter</h1>
            <p class="text-blue-200 text-xs opacity-80" id="rate-info">Memuat kurs terbaru...</p>
            <div class="mt-2 text-[10px] bg-blue-500/20 py-1 px-3 rounded-full inline-block border border-blue-400/30 text-blue-300">
                1,2T Rupiah = 1 Hari MBG
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-blue-200 mb-2 uppercase tracking-wider">Mata Uang</label>
                <select id="currency" class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all text-white">
                    <option value="IDR" class="bg-slate-800">IDR - Rupiah</option>
                    <option value="USD" class="bg-slate-800">USD - Dollar AS</option>
                    <option value="SGD" class="bg-slate-800">SGD - Singapore Dollar</option>
                    <option value="JPY" class="bg-slate-800">JPY - Japanese Yen</option>
                    <option value="SAR" class="bg-slate-800">SAR - Saudi Riyal</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-blue-200 mb-2 uppercase tracking-wider text-right">Jumlah Uang</label>
                <div class="relative">
                    <input type="number" id="amount" placeholder="0" class="w-full bg-white/10 border border-white/20 rounded-xl py-4 px-4 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all placeholder:text-white/20 text-right">
                </div>
            </div>

            <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/50 transition-all active:scale-95">
                Hitung Sekarang
            </button>
        </div>

        <div class="mt-10 pt-8 border-t border-white/10 text-center">
            <p class="text-blue-200 text-sm mb-1">Hasil</p>
            <div class="mb-6">
                <span id="res-day" class="text-5xl font-bold">0</span>
                <span class="text-xl text-blue-300 ml-1">Hari MBG</span>
            </div>

            <div class="grid grid-cols-3 gap-2 text-xs font-medium uppercase tracking-tighter opacity-80 mb-6">
                <div class="bg-white/5 p-3 rounded-lg"><span id="res-hour" class="block text-lg font-bold">0</span> Jam</div>
                <div class="bg-white/5 p-3 rounded-lg"><span id="res-min" class="block text-lg font-bold">0</span> Menit</div>
                <div class="bg-white/5 p-3 rounded-lg"><span id="res-sec" class="block text-lg font-bold">0</span> Detik</div>
            </div>

            <div class="bg-white/10 py-4 rounded-2xl border border-white/5">
                <p class="text-[10px] text-blue-300 uppercase mb-1">Atau tepatnya</p>
                <p id="res-precise" class="text-2xl font-bold text-blue-400">0 Detik</p>
            </div>
        </div>
    </div>

    <script>
        const MBG_PER_DAY = 1200000000000; // 1,2 Triliun IDR
        let rates = { IDR: 1 };

        // Ambil Kurs Otomatis (Menggunakan API Frankfurter - Gratis/Tanpa Key)
        async function fetchRates() {
            try {
                const res = await fetch('https://api.frankfurter.app/latest?from=USD&to=IDR,SGD,JPY,SAR');
                const data = await res.json();
                rates = { 
                    IDR: data.rates.IDR,
                    USD: 1,
                    SGD: 1 / (data.rates.IDR / data.rates.SGD), // Estimasi cross rate ke IDR
                    JPY: 1 / (data.rates.IDR / data.rates.JPY),
                    SAR: 1 / (data.rates.IDR / data.rates.SAR)
                };
                
                // Normalisasi agar basisnya IDR
                const usdToIdr = data.rates.IDR;
                document.getElementById('rate-info').innerText = `1 USD = ${usdToIdr.toLocaleString('id-ID')} IDR`;
            } catch (err) {
                document.getElementById('rate-info').innerText = "Gagal memuat kurs. Menggunakan estimasi (17k).";
                rates = { IDR: 1, USD: 17000, SGD: 12500, JPY: 110, SAR: 4500 };
            }
        }

        function calculate() {
            const currency = document.getElementById('currency').value;
            const amount = document.getElementById('amount').value;
            
            // Konversi ke IDR dulu
            let valInIdr;
            if (currency === 'IDR') {
                valInIdr = amount;
            } else {
                // Sederhananya kita pakai rate USD ke IDR dari API
                valInIdr = amount * rates.IDR; // Jika base API kita ubah ke IDR
            }

            // Hitung Hari MBG
            const totalDays = valInIdr / MBG_PER_DAY;
            
            // Breakdown Waktu
            const totalSeconds = totalDays * 24 * 3600;
            const days = Math.floor(totalDays);
            const hours = Math.floor((totalSeconds / 3600) % 24);
            const minutes = Math.floor((totalSeconds / 60) % 60);
            const seconds = (totalSeconds % 60).toFixed(1);

            // Update UI
            document.getElementById('res-day').innerText = days;
            document.getElementById('res-hour').innerText = hours;
            document.getElementById('res-min').innerText = minutes;
            document.getElementById('res-sec').innerText = Math.floor(seconds);
            
            if (totalSeconds < 60) {
                document.getElementById('res-precise').innerText = `${seconds} Detik`;
            } else if (totalSeconds < 3600) {
                document.getElementById('res-precise').innerText = `${minutes} Menit ${Math.floor(seconds)} Detik`;
            } else {
                document.getElementById('res-precise').innerText = `${days} Hari ${hours} Jam`;
            }
        }

        fetchRates();
    </script>
</body>
</html>
